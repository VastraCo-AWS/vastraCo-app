  # ══════════════════════════════════════════════════════════════════════════

  ai-service-prepare:
    name: AI Service / Prepare & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.ai-service == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all_services == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Dependencies
        working-directory: ai-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run pytest
        working-directory: ai-service
        run: |
          if find . \( -name "test_*.py" -o -name "*_test.py" \) -print -quit 2>/dev/null | grep -q . \
             || [ -d "tests" ]; then
            echo "Test files found — running pytest."
            pytest --tb=short -q
          else
            echo "ℹ️  No test files or tests/ directory found — skipping pytest."
          fi

  ai-service-sonar:
    name: AI Service / SonarCloud
    needs: ai-service-prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        with:
          projectBaseDir: ai-service
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ai-service-snyk:
    name: AI Service / Snyk
    needs: ai-service-prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Dependencies
        working-directory: ai-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Dependency Scan
        working-directory: ai-service
        run: snyk test --file=requirements.txt --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  ai-service-trivy-fs:
    name: AI Service / Trivy FS
    needs: ai-service-prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ai-service/
          severity: CRITICAL
          exit-code: '1'
          format: table

  ai-service-build-push:
    name: AI Service / Build & Push
    needs: [ai-service-sonar, ai-service-snyk, ai-service-trivy-fs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t ai-service:${{ steps.vars.outputs.sha }} \
            ./ai-service

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ai-service:${{ steps.vars.outputs.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push to ECR
        run: |
          ECR_URI="${{ env.ECR_REGISTRY }}/ai-service"
          docker tag ai-service:${{ steps.vars.outputs.sha }} ${ECR_URI}:${{ steps.vars.outputs.sha }}
          docker push ${ECR_URI}:${{ steps.vars.outputs.sha }}

      - name: Generate Build Metadata
        run: |
          mkdir -p metadata
          cat > metadata/metadata.json <<'EOF'
          {
            "service_name": "ai-service",
            "image_uri": "${{ env.ECR_REGISTRY }}/ai-service:${{ steps.vars.outputs.sha }}",
            "image_tag": "${{ steps.vars.outputs.sha }}"
          }
          EOF

      - name: Upload Build Metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-ai-service
          path: metadata/metadata.json
          retention-days: 1
