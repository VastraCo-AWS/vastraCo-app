name: VastraCo CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      force_all_services:
        description: 'Run ALL service CI jobs regardless of changed files'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 078426574503.dkr.ecr.us-east-1.amazonaws.com

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # STAGE 0 — Detect which services changed
  # ──────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      frontend:        ${{ steps.filter.outputs.frontend }}
      user-service:    ${{ steps.filter.outputs.user-service }}
      product-service: ${{ steps.filter.outputs.product-service }}
      order-service:   ${{ steps.filter.outputs.order-service }}
      ai-service:      ${{ steps.filter.outputs.ai-service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            user-service:
              - 'user-service/**'
            product-service:
              - 'product-service/**'
            order-service:
              - 'order-service/**'
            ai-service:
              - 'ai-service/**'

  # ══════════════════════════════════════════════════════════════════════════
  # FRONTEND  (React / Node.js)
  #
  # Graph:  prepare → sonar ──┐
  #                  snyk  ───┼── build-push
  #                  trivy-fs ┘
  # ══════════════════════════════════════════════════════════════════════════

  frontend-prepare:
    name: Frontend / Prepare & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_all_services == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Run Unit Tests
        working-directory: frontend
        run: |
          TEST_SCRIPT=$(node -pe "(require('./package.json').scripts || {}).test || ''" 2>/dev/null || echo "")
          if [ -z "$TEST_SCRIPT" ] || echo "$TEST_SCRIPT" | grep -qi "no test specified"; then
            echo "ℹ️  No test script defined in package.json — skipping unit tests."
          else
            npm test
          fi

  frontend-sonar:
    name: Frontend / SonarCloud
    needs: frontend-prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend-snyk:
    name: Frontend / Snyk
    needs: frontend-prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Dependency Scan
        working-directory: frontend
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  frontend-trivy-fs:
    name: Frontend / Trivy FS
    needs: frontend-prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend/
          severity: CRITICAL
          exit-code: '1'
          format: table

  frontend-build-push:
    name: Frontend / Build & Push
    needs: [frontend-sonar, frontend-snyk, frontend-trivy-fs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t frontend-service:${{ steps.vars.outputs.sha }} \
            ./frontend

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend-service:${{ steps.vars.outputs.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push to ECR
        run: |
          ECR_URI="${{ env.ECR_REGISTRY }}/frontend-service"
          docker tag frontend-service:${{ steps.vars.outputs.sha }} ${ECR_URI}:${{ steps.vars.outputs.sha }}
          docker push ${ECR_URI}:${{ steps.vars.outputs.sha }}

      - name: Generate Build Metadata
        run: |
          mkdir -p metadata
          cat > metadata/metadata.json <<'EOF'
          {
            "service_name": "frontend",
            "image_uri": "${{ env.ECR_REGISTRY }}/frontend-service:${{ steps.vars.outputs.sha }}",
            "image_tag": "${{ steps.vars.outputs.sha }}"
          }
          EOF

      - name: Upload Build Metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-frontend
          path: metadata/metadata.json
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════════
  # USER SERVICE  (Node.js)
  #
  # Graph:  prepare → sonar ──┐
  #                  snyk  ───┼── build-push
